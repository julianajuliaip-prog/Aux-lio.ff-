<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Auxílio FF</title>
<style>
:root{--bg:#0b0e13;--panel:#12161f;--line:#1e2532;--txt:#c8d1e0;--dim:#5d6b82;--acc:#00e0a4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt);overflow:hidden;user-select:none}
#panel{position:fixed;top:80px;left:16px;width:300px;max-width:calc(100vw - 32px);max-height:78vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 12px 40px #000a;overflow:hidden;z-index:10}
#dragbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#161b26;border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
#dragbar span{font-size:12px;letter-spacing:2px;color:var(--acc)}
#dragbar button{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;padding:9px 0;font:inherit;font-size:11px;letter-spacing:1px;color:var(--dim);cursor:pointer}
nav button.active{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
main{overflow-y:auto;padding:6px 12px 14px;flex:1}
main section{display:none}
main section.active{display:block}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #161c27;font-size:12px}
.sw{position:relative;width:38px;height:20px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:#202838;border-radius:10px;transition:.15s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#5d6b82;border-radius:50%;transition:.15s}
.sw input:checked+i{background:#0a3a2e}
.sw input:checked+i:after{left:20px;background:var(--acc)}
.range{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-bottom:1px solid #161c27;font-size:12px}
.range b{color:var(--acc);font-weight:400}
.range input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:#202838;border-radius:2px;outline:0}
.range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
select,textarea{width:100%;background:#0d1119;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12px;outline:0}
.btn{width:100%;margin-top:10px;padding:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;font:inherit;font-size:12px;letter-spacing:1px;cursor:pointer}
.btn:active{background:#0a3a2e}
.btn2{border-color:var(--line);color:var(--dim)}
#out{height:120px;resize:none;font-size:11px;color:var(--acc);margin-top:10px}
#fab{position:fixed;right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:var(--panel);border:1px solid var(--acc);color:var(--acc);font-size:20px;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:9;box-shadow:0 8px 24px #000a}
#fab.show{display:flex}
.hint{font-size:10px;color:var(--dim);margin:8px 0 0;line-height:1.4}
</style>
</head>
<body>
<div id="panel">
  <header id="dragbar">
    <span>AUXÍLIO FF</span>
    <button id="btnMin">—</button>
  </header>
  <nav>
    <button data-tab="aim" class="active">AIM</button>
    <button data-tab="esp">ESP</button>
    <button data-tab="misc">MISC</button>
    <button data-tab="cfg">CFG</button>
  </nav>
  <main>
    <section data-panel="aim" class="active">
      <div class="row">Aimbot <label class="sw"><input type="checkbox" data-cfg="aim.enabled"><i></i></label></div>
      <div class="range">FOV <b><span data-out="aim.fov">120</span> px</b><input type="range" data-cfg="aim.fov" min="10" max="360" value="120"></div>
      <div class="range">Suavidade <b><span data-out="aim.smooth">6</span></b><input type="range" data-cfg="aim.smooth" min="1" max="20" value="6"></div>
      <div class="row">Osso
        <select data-cfg="aim.bone" style="width:110px">
          <option value="head">Cabeça</option>
          <option value="chest" selected>Peito</option>
          <option value="body">Corpo</option>
        </select>
      </div>
      <div class="row">Só visível <label class="sw"><input type="checkbox" data-cfg="aim.visible"><i></i></label></div>
    </section>
    <section data-panel="esp">
      <div class="row">Caixa <label class="sw"><input type="checkbox" data-cfg="esp.box" checked><i></i></label></div>
      <div class="row">Linha <label class="sw"><input type="checkbox" data-cfg="esp.line"><i></i></label></div>
      <div class="row">Nome <label class="sw"><input type="checkbox" data-cfg="esp.name" checked><i></i></label></div>
      <div class="row">Vida <label class="sw"><input type="checkbox" data-cfg="esp.health" checked><i></i></label></div>
      <div class="row">Distância <label class="sw"><input type="checkbox" data-cfg="esp.dist"><i></i></label></div>
      <div class="row">Esqueleto <label class="sw"><input type="checkbox" data-cfg="esp.skeleton"><i></i></label></div>
      <div class="row">Cor <input type="color" data-cfg="esp.color" value="#00e0a4" style="width:44px;height:26px;background:none;border:1px solid var(--line);border-radius:6px"></div>
    </section>
    <section data-panel="misc">
      <div class="row">No recoil <label class="sw"><input type="checkbox" data-cfg="misc.noRecoil" checked><i></i></label></div>
      <div class="row">Sem spread <label class="sw"><input type="checkbox" data-cfg="misc.noSpread"><i></i></label></div>
      <div class="row">Antena <label class="sw"><input type="checkbox" data-cfg="misc.antenna"><i></i></label></div>
      <div class="row">Fast fire <label class="sw"><input type="checkbox" data-cfg="misc.fastFire"><i></i></label></div>
      <div class="range">Speed <b>×<span data-out="misc.speed">1.0</span></b><input type="range" data-cfg="misc.speed" min="0.5" max="3" step="0.1" value="1"></div>
    </section>
    <section data-panel="cfg">
      <div class="row">Formato
        <select id="fmt" style="width:110px">
          <option value="json">JSON</option>
          <option value="b64" selected>Base64</option>
        </select>
      </div>
      <button class="btn" id="gen">GERAR CONFIG</button>
      <textarea id="out" readonly placeholder="config..."></textarea>
      <button class="btn btn2" id="copy">COPIAR</button>
      <p class="hint">O painel não toca no jogo — ele monta o config. Cola o output no teu loader/overlay webview.</p>
    </section>
  </main>
</div>
<div id="fab">⚙</div>
<script>
const $ = s => document.querySelector(s);
const panel = $('#panel');

function setPath(obj, path, val){
  const p = path.split('.');
  let o = obj;
  for (let i = 0; i < p.length - 1; i++){ o[p[i]] = o[p[i]] || {}; o = o[p[i]]; }
  o[p[p.length - 1]] = val;
}
function getPath(obj, path){
  return path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
}
function collect(){
  const c = {};
  document.querySelectorAll('[data-cfg]').forEach(el => {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'range') v = Number(el.value);
    else v = el.value;
    setPath(c, el.dataset.cfg, v);
  });
  return c;
}

// load saved state
try {
  const saved = JSON.parse(localStorage.getItem('ffcfg') || 'null');
  if (saved) document.querySelectorAll('[data-cfg]').forEach(el => {
    const v = getPath(saved, el.dataset.cfg);
    if (v === undefined) return;
    if (el.type === 'checkbox') el.checked = !!v;
    else el.value = v;
  });
} catch (e) {}

// sync labels + persist on input
document.querySelectorAll('[data-cfg]').forEach(el => {
  const sync = () => {
    const out = document.querySelector(`[data-out="${el.dataset.cfg}"]`);
    if (out) out.textContent = el.value;
    localStorage.setItem('ffcfg', JSON.stringify(collect()));
  };
  el.addEventListener('input', sync);
  el.addEventListener('change', sync);
  sync();
});

// drag
let drag = null;
$('#dragbar').addEventListener('pointerdown', e => {
  if (e.target.tagName === 'BUTTON') return;
  drag = { x: e.clientX, y: e.clientY, l: panel.offsetLeft, t: panel.offsetTop };
  panel.style.left = panel.offsetLeft + 'px';
  panel.style.top = panel.offsetTop + 'px';
  e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const w = panel.offsetWidth, h = panel.offsetHeight;
  let l = drag.l + e.clientX - drag.x, t = drag.t + e.clientY - drag.y;
  l = Math.max(0, Math.min(innerWidth - w, l));
  t = Math.max(0, Math.min(innerHeight - 40, t));
  panel.style.left = l + 'px';
  panel.style.top = t + 'px';
});
window.addEventListener('pointerup', () => drag = null);
window.addEventListener('pointercancel', () => drag = null);

// minimize
$('#btnMin').addEventListener('click', () => { panel.style.display = 'none'; $('#fab').classList.add('show'); });
$('#fab').addEventListener('click', () => { panel.style.display = 'flex'; $('#fab').classList.remove('show'); });

// tabs
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('active', s.dataset.panel === b.dataset.tab));
}));

// generate
$('#gen').addEventListener('click', () => {
  const c = collect();
  localStorage.setItem('ffcfg', JSON.stringify(c));
  const json = JSON.stringify(c, null, 2);
  $('#out').value = $('#fmt').value === 'b64'
    ? btoa(unescape(encodeURIComponent(json)))
    : json;
});

// copy
$('#copy').addEventListener('click', async () => {
  const v = $('#out').value;
  if (!v) return;
  try { await navigator.clipboard.writeText(v); }
  catch (e) {
    const t = document.createElement('textarea');
    t.value = v; document.body.appendChild(t); t.select();
    document.execCommand('copy'); t.remove();
  }
  $('#copy').textContent = 'COPIADO';
  setTimeout(() => $('#copy').textContent = 'COPIAR', 1200);
});
</script>
</body>
  </html>
